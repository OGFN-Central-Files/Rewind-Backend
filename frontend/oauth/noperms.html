<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewind | Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00c6ff;
            --secondary: #92fe9d;
            --dark: #0a0a0a;
            --light-text: #ffffff;
            --gray-text: #a0a0a0;
        }

        body {
            background: #121117;
            font-family: 'Inter', sans-serif;
            color: var(--light-text);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .floating-squares {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .floating-squares div {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(27, 27, 27, 0.9);
            animation: floatSquares 30s linear infinite;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            bottom: -250px; 
        }

     
        .floating-squares div:nth-child(1) { left: 5%; animation-duration: 25s; }
        .floating-squares div:nth-child(2) { left: 25%; animation-duration: 28s; animation-delay: -10s; }
        .floating-squares div:nth-child(3) { left: 45%; animation-duration: 27s; animation-delay: -5s; }
        .floating-squares div:nth-child(4) { left: 65%; animation-duration: 29s; animation-delay: -15s; }
        .floating-squares div:nth-child(5) { left: 85%; animation-duration: 24s; animation-delay: -8s; }
        .floating-squares div:nth-child(6) { left: 15%; animation-duration: 26s; animation-delay: -12s; }
        .floating-squares div:nth-child(7) { left: 35%; animation-duration: 23s; animation-delay: -18s; }
        .floating-squares div:nth-child(8) { left: 55%; animation-duration: 30s; animation-delay: -20s; }
        .floating-squares div:nth-child(9) { left: 75%; animation-duration: 27s; animation-delay: -7s; }
        .floating-squares div:nth-child(10) { left: 95%; animation-duration: 25s; animation-delay: -15s; }

        @keyframes floatSquares {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-2000px) rotate(360deg);
                opacity: 0.8;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .center-display-box {
            background: rgba(24, 24, 28, 0.8);
            width: 26vw;
            height: 35vh;
            max-width: 90%;
            gap: 10px;
            max-height: 75%;
            border-radius: 2vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 0.1vh solid #31313142;
            padding: 0.5vh;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .button {
            background: #2b2b31;
            width: 80%;
            height: 15%;
            border-radius: 1.0vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            font-size: 1rem;
            text-transform: none;
            cursor: pointer;
            transition: background 0.3s ease;
            position: absolute;
            font-family: "Inter", sans-serif;
            margin-top: 2%;
        }

        .continue-button-view {
            bottom: 20%;
        }

        .go-home-button-view {
            bottom: 10%;
        }

        .button:hover {
            background: #3d3d44;
        }

        .logo {
            width: 6vw;
            height: 6vw;
            max-width: 50px;
            max-height: 50px;
            background-image: url("");
            background-size: contain;
            background-repeat: no-repeat;
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        .login-title {
            font-size: 66px;
            color: #fff;
            text-align: center;
            margin-bottom: -3px;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 11%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .desc {
            font-size: 1vw;
            width: 80%;
            text-align: center;
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
        }

        .signed-in-message {
            font-size: 0.9vw;
            width: 80%;
            text-align: center;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
        }

        .pfp {
            width: 15vh;
            height: 15vh;
            text-align: center;
            position: absolute;
            top: 45%;
            left: -10%;
            transform: translate(-50%, -50%);
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            .center-display-box {
                width: 80vw;
                height: 60vh;
            }
            .continue-button-view {
                font-size: 1.2rem;
            }
            .go-home-button-view {
                font-size: 1.2rem;
            }
            .login-title {
                font-size: 40px;
            }
            .desc {
                font-size: 3vw;
            }
            .signed-in-message {
                font-size: 2.5vw;
            }
            .logo {
                width: 10vw;
                height: 10vw;
            }
        }

        @media (max-width: 480px) {
            .center-display-box {
                width: 90vw;
                height: 70vh;
            }
            .continue-button-view {
                font-size: 1.4rem;
            }
            .go-home-button-view {
                font-size: 1.4rem;
            }
            .login-title {
                font-size: 32px;
            }
            .desc {
                font-size: 3.5vw;
            }
            .signed-in-message {
                font-size: 3vw;
            }
            .logo {
                width: 12vw;
                height: 12vw;
            }
        }
    </style>
</head>
<body>
    <div class="floating-squares">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="center-display-box">
        <div class="logo"></div>
        <div class="login-title">Rewind</div>
        <div style="display: flex; align-items: center; position: absolute; top: 55%; transform: translateY(-50%);">
            <div class="pfp" id="pfp" style="width: 48px; height: 48px;"></div>
            <div style="margin-left: 12px;">
                <div style="color: white; font-weight: 600;">%username% - %role%</div>
                <div style="color: rgba(255, 255, 255, 0.5); font-size: 0.9em;">%accountId%</div>
            </div>
        </div>
        <div class="continue-button-view button" style="top: 69%;" id="msg2">
            <span style="color: red; font-weight: 700;">You do not have permissions to currently login.</span>
        </div>
    </div>
</body>
</html>
